[package]
name = "oxide-calc"
version = "0.1.0"
edition = "2024"
description = "Oxide-calc: Material 3 desktop calculator for Linux, built with Slint and the Oxide design system."
license = "MIT"
repository = "https://github.com/william-franco/oxide-calc"

[dependencies]
slint = "1.18"

[build-dependencies]
slint-build = "1.18"
oxide-ui = { git = "https://github.com/william-franco/oxide-ui", branch = "main" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
